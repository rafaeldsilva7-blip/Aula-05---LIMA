<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Utilizando CSS Interno na página</title>

    <!-- CSS Interno SEMPRE FICA NO HEAD DA PÁGINA!!! -->
    <style>
        /* Adicionando CSS à tag p */
        p {
            color: red;
            font-size: 23px;
        }

        h1 {
            background-color: rgb(6, 99, 99);
        }

        s {
            font-size: 25px;
        }
    </style>
</head>
<body>
    <p>CSS Interno da página</p>
    <h1>Sei lá</h1>
    <s>Qualquer coisa</s>
</body>
</html>
